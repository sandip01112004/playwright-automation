services:
  automation:
    build: .
    ports:
      - "3000:3000" # Dashboard
      - "3001:3001" # Trigger API
    env_file:
      - .env
    environment:
      - HEADLESS=true
      - NODE_ENV=development
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    restart: unless-stopped
